<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>筋トレ記録</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>筋トレ記録</h1>
</header>

<main>
  <form id="record-form" class="record-form">
    <div class="field">
      <label for="exercise">種目</label>
      <input type="text" id="exercise" list="exercise-options" placeholder="例: ベンチプレス" autocomplete="off" required>
      <datalist id="exercise-options"></datalist>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="weight">重量 (kg)</label>
        <input type="number" id="weight" inputmode="decimal" step="0.5" min="0" placeholder="60">
      </div>
      <div class="field">
        <label for="reps">回数</label>
        <input type="number" id="reps" inputmode="numeric" step="1" min="0" placeholder="10">
      </div>
    </div>
    <button type="submit" class="btn-primary">追加</button>
  </form>

  <section id="history" class="history"></section>
</main>

<template id="day-group-template">
  <div class="day-group">
    <h2 class="day-title"></h2>
    <ul class="entry-list"></ul>
  </div>
</template>

<template id="entry-template">
  <li class="entry">
    <div class="entry-main">
      <span class="entry-exercise"></span>
      <span class="entry-detail"></span>
    </div>
    <button type="button" class="btn-delete" aria-label="削除">×</button>
  </li>
</template>

<script src="js/app.js"></script>
</body>
</html>
